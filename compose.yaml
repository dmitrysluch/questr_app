services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: questr
      POSTGRES_PASSWORD: questr_local
      POSTGRES_DB: questr
    ports:
      - "127.0.0.1:55432:5432"
    volumes:
      - questr_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U questr -d questr"]
      interval: 3s
      timeout: 3s
      retries: 20
  app:
    build: .
    ports:
      - "127.0.0.1:5180:3001"
    environment:
      DATABASE_URL: postgresql://questr:questr_local@db:5432/questr
      PORT: 3001
      APP_ORIGIN: ${APP_ORIGIN_DOCKER:-http://localhost:5180}
      AUTH_MODE: ${AUTH_MODE:-demo}
      AI_MODE: ${AI_MODE:-demo}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4.1-mini}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_WEBHOOK_SECRET: ${TELEGRAM_WEBHOOK_SECRET:-}
      PUBLIC_APP_URL: ${PUBLIC_APP_URL:-}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
    depends_on:
      db:
        condition: service_healthy
volumes:
  questr_pg:
